name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Test without modifying system memory or startup
        shell: powershell
        run: .\test.ps1
      - name: Package and verify extracted program
        shell: powershell
        run: |
          .\package.ps1
          .\verify-package.ps1
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $fileVersion = [Version][Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD 'dist\ClearMemory.exe')).FileVersion
          $expectedTag = 'v{0}.{1}.{2}' -f $fileVersion.Major,$fileVersion.Minor,$fileVersion.Build
          if ($env:GITHUB_REF_NAME -ne $expectedTag) { throw 'Tag does not match application version.' }
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClearMemory-${{ matrix.os }}
          path: |
            dist/ClearMemory-*-win-x64.zip
            dist/ClearMemory-*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild release from verified source
        shell: powershell
        run: |
          .\build.ps1
          .\test.ps1
          .\package.ps1
          .\verify-package.ps1
      - name: Publish versioned portable ZIP
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem dist\ClearMemory-*-win-x64.zip,dist\ClearMemory-*-win-x64.zip.sha256 | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "ClearMemory $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE) { throw 'Release creation failed.' }
